name: CI — Test & Lint

on:
  push:
    branches: ["**"] # كل branch
  pull_request:
    branches: [main, develop] # PR على main أو develop

jobs:
  # ─── Job 1: Tests ──────────────────────────────────────────────────────
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x] # نتأكد إن المشروع بيشتغل على اثنين versions

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧪 Run tests
        run: npm test
        env:
          NODE_ENV: test
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: 📊 Upload test results
        if: always() # حتى لو الـ tests فشلت
        uses: actions/upload-artifact@v4
        with:
          name: test-results-node-${{ matrix.node-version }}
          path: |
            coverage/
          retention-days: 7

  # ─── Job 2: Lint ───────────────────────────────────────────────────────
  lint:
    name: 🔍 Lint Code
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Run ESLint
        run: npx eslint src/ --ext .js --max-warnings=0
        continue-on-error: true # مش هيفشّل الـ workflow لو فيه warnings

  # ─── Job 3: Security Audit ─────────────────────────────────────────────
  security:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔒 npm audit
        run: npm audit --audit-level=high
        continue-on-error: true # يبلّغ بس مش يوقف الـ deploy
